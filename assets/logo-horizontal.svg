<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
  <title id="title">Plataforma Espectral - Logo Final</title>
  <desc id="desc">Logotipo con esquinas de enfoque enmarcando la lupa técnica y la muestra orgánica centrada.</desc>
  <defs>
    <linearGradient id="lupaFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5a2e5"/>
      <stop offset="50%" stop-color="#6344a9"/>
      <stop offset="100%" stop-color="#4b2a90"/>
    </linearGradient>
    <radialGradient id="lesionGradient" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
      <stop offset="0%" stop-color="#a286e1"/>
      <stop offset="70%" stop-color="#6344a9"/>
      <stop offset="100%" stop-color="#4b2a90"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="1.5" dy="1.5" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(40, 35)">
    <g fill="none" stroke="#6344a9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <path d="M40 90 V55 a21 21 0 0 1 21-21 h35"/>
      <path d="M180 34 h35 a21 21 0 0 1 21 21 v35"/>
      <path d="M236 150 v35 a21 21 0 0 1-21 21 h-35"/>
    </g>
    <path d="M85 185 L45 225" stroke="url(#lupaFrame)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="138" cy="120" r="72" stroke="url(#lupaFrame)" stroke-width="8" fill="none"/>
    <circle cx="138" cy="120" r="66" stroke="#6344a9" stroke-width="1" fill="#ffffff"/>
    <g stroke="#6344a9" stroke-width="0.4" opacity="0.15">
      <line x1="98" y1="120" x2="178" y2="120"/>
      <line x1="138" y1="80" x2="138" y2="160"/>
      <circle cx="138" cy="120" r="25" fill="none"/>
      <circle cx="138" cy="120" r="45" fill="none"/>
    </g>
    <path d="M118 130c-10-5-8-25 5-30 15-7 8-35 30-33 18-1 15 20 28 22 15 3 12 25 2 32-10 7-8 28-25 26-15-1-15-15-40-17Z" fill="url(#lesionGradient)" filter="url(#shadow)" opacity="0.95" transform="translate(-5, -5)"/>
  </g>
  <g font-family="Manrope, Inter, Arial, sans-serif" font-weight="800">
    <text x="310" y="130" font-size="64" fill="#4b2a90" letter-spacing="-1.5">Plataforma</text>
    <text x="310" y="200" font-size="64" fill="#6344a9" letter-spacing="-1.5">Espectral</text>
  </g>
</svg>
